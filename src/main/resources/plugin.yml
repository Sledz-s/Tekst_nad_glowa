name: TekstNadGlowo
description: Wyświetla tekst nad głową gracza
version: '1.0'

main: net.sl3dz.plugin.tekstNadGlowo.TekstNadGlowo
api-version: '1.20'

commands:
  opis:
    description: Wyświetla pływający tekst nad głową gracza
    usage: /opis <text>
    permission: tekstnadglowo.opis

permissions:
  tekstnadglowo.opis:
    description: Pozwala na używanie komendy /opis
    default: true

authors: [ sl3DZ ]